<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3-day Air Quality Index forecasts for cities across Pakistan." />
    <meta name="theme-color" content="#0e1116" />
    <link rel="icon" type="image/png" href="/10pearls-logo.png" />
    <link rel="apple-touch-icon" href="/10pearls-logo.png" />
    <title>Pearls AQI Predictor</title>
    <style>
      /* Pre-JS paint — matches the React SplashScreen so they crossfade cleanly */
      #splash {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: radial-gradient(1200px 600px at 50% 32%, #161c26 0%, #0e1116 60%);
        z-index: 9999;
      }
      #splash img {
        width: 240px; max-width: 62vw; height: auto;
        animation: splashLogoIn 0.9s cubic-bezier(.2,.7,.2,1) both;
      }
      @keyframes splashLogoIn {
        from { opacity: 0; transform: scale(.8) translateY(10px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <img src="/10pearls-logo.png" alt="10Pearls" />
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
