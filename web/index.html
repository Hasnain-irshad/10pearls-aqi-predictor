<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3-day Air Quality Index forecasts for cities across Pakistan." />
    <meta name="theme-color" content="#0e1116" />
    <link rel="icon" type="image/png" href="/10pearls-logo.png" />
    <link rel="apple-touch-icon" href="/10pearls-logo.png" />
    <title>Pearls AQI Predictor</title>
    <style>
      /* Instant splash — shown before the React bundle loads, then replaced */
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: #0e1116; z-index: 9999;
      }
      #splash img { width: 220px; max-width: 60vw; height: auto; }
      #splash .spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid #2a2f3a; border-top-color: #4aa3df;
        animation: spin 0.8s linear infinite;
      }
      #splash .splash-text {
        color: #9aa4b2; font: 14px "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.3px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <img src="/10pearls-logo.png" alt="10Pearls" />
      <div class="spinner"></div>
      <div class="splash-text">Loading Pearls AQI Predictor…</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
