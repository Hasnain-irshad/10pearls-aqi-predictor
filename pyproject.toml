[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pearls-aqi-predictor"
version = "0.1.0"
description = "End-to-end serverless ML system that forecasts Air Quality Index 3 days ahead for Lahore."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "10Pearls Internship" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
