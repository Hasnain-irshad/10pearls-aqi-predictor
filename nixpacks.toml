# Railway / Nixpacks build for the FastAPI backend.
# Uses the slim requirements-deploy.txt (not the heavy requirements.txt) and
# installs the `aqi` package itself without re-resolving its deps.
[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r requirements-deploy.txt",
  "pip install -e . --no-deps",
]

[start]
cmd = "uvicorn aqi.api.main:app --host 0.0.0.0 --port $PORT"
