<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"></head>
<body><div id="canvas">
<svg width="1000" height="740" viewBox="0 0 1000 740">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2C6FB5"/></marker>
    <marker id="g" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2E7D52"/></marker>
    <marker id="r" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#B5485B"/></marker>
  </defs>

  <text x="500" y="32" text-anchor="middle" class="t-title">The Champion-Challenger Promotion Gate</text>

  <!-- candidates -->
  <rect x="60" y="62" width="880" height="86" rx="12" fill="#EEF4FA" stroke="#2C6FB5" stroke-width="1.8"/>
  <text x="500" y="88" text-anchor="middle" class="t-h">Every daily run trains the same four candidates on the same chronological split</text>
  <rect x="92" y="100" width="190" height="34" rx="7" fill="#fff" stroke="#B9C6D6"/><text x="187" y="122" text-anchor="middle" class="t-s">Persistence baseline</text>
  <rect x="300" y="100" width="190" height="34" rx="7" fill="#fff" stroke="#B9C6D6"/><text x="395" y="122" text-anchor="middle" class="t-s">Ridge regression</text>
  <rect x="508" y="100" width="190" height="34" rx="7" fill="#fff" stroke="#B9C6D6"/><text x="603" y="122" text-anchor="middle" class="t-s">Random forest</text>
  <rect x="716" y="100" width="190" height="34" rx="7" fill="#1F3A5F"/><text x="811" y="122" text-anchor="middle" class="t-s" style="fill:#fff">XGBoost</text>

  <path d="M500,150 L500,178" stroke="#2C6FB5" stroke-width="2.6" fill="none" marker-end="url(#a)"/>
  <rect x="320" y="182" width="360" height="52" rx="9" fill="#FBEEDF" stroke="#C8881A" stroke-width="1.8"/>
  <text x="500" y="204" text-anchor="middle" class="t-b" fill="#8a5e12">Challenger = the fitted candidate with the lowest validation RMSE</text>
  <text x="500" y="224" text-anchor="middle" class="t-s">the persistence baseline is scored but is never eligible to ship</text>

  <path d="M500,236 L500,264" stroke="#2C6FB5" stroke-width="2.6" fill="none" marker-end="url(#a)"/>

  <!-- gate -->
  <polygon points="500,268 720,352 500,436 280,352" fill="#F7FAFD" stroke="#1F3A5F" stroke-width="2.4"/>
  <text x="500" y="338" text-anchor="middle" class="t-h">Is challenger RMSE</text>
  <text x="500" y="362" text-anchor="middle" class="t-h">below champion RMSE?</text>
  <text x="500" y="386" text-anchor="middle" class="t-s">margin = 0.0, so a tie keeps the incumbent</text>

  <!-- yes -->
  <path d="M720,352 L800,352" stroke="#2E7D52" stroke-width="2.6" fill="none" marker-end="url(#g)"/>
  <text x="760" y="342" text-anchor="middle" class="t-s">yes</text>
  <rect x="806" y="306" width="176" height="92" rx="10" fill="#E6F2EC" stroke="#2E7D52" stroke-width="1.8"/>
  <text x="894" y="332" text-anchor="middle" class="t-b">Promote</text>
  <text x="894" y="354" text-anchor="middle" class="t-s">demote the old champion,</text>
  <text x="894" y="372" text-anchor="middle" class="t-s">save the bundle and push</text>
  <text x="894" y="390" text-anchor="middle" class="t-s">a new registry version</text>

  <!-- no -->
  <path d="M280,352 L200,352" stroke="#B5485B" stroke-width="2.6" fill="none" marker-end="url(#r)"/>
  <text x="240" y="342" text-anchor="middle" class="t-s">no</text>
  <rect x="18" y="306" width="176" height="92" rx="10" fill="#F4E9EC" stroke="#B5485B" stroke-width="1.8"/>
  <text x="106" y="332" text-anchor="middle" class="t-b" fill="#8d3444">Reject</text>
  <text x="106" y="354" text-anchor="middle" class="t-s">record the attempt,</text>
  <text x="106" y="372" text-anchor="middle" class="t-s">keep the serving model</text>
  <text x="106" y="390" text-anchor="middle" class="t-s">exactly as it is</text>

  <!-- leaderboard -->
  <path d="M106,398 C106,440 300,442 460,448" stroke="#5C6B7A" stroke-width="1.8" fill="none" stroke-dasharray="4 3"/>
  <path d="M894,398 C894,440 700,442 540,448" stroke="#5C6B7A" stroke-width="1.8" fill="none" stroke-dasharray="4 3"/>

  <rect x="120" y="452" width="760" height="164" rx="12" fill="#F7FAFD" stroke="#B9C6D6" stroke-width="1.6"/>
  <text x="500" y="478" text-anchor="middle" class="t-h">Both outcomes are appended to the persistent leaderboard</text>

  <line x1="150" y1="492" x2="850" y2="492" stroke="#B9C6D6"/>
  <text x="168" y="512" class="t-b">Ver</text>
  <text x="240" y="512" class="t-b">Trained</text>
  <text x="420" y="512" class="t-b">Model</text>
  <text x="556" y="512" class="t-b">RMSE</text>
  <text x="650" y="512" class="t-b">Result</text>
  <line x1="150" y1="522" x2="850" y2="522" stroke="#B9C6D6"/>

  <text x="168" y="546" class="t-s">1</text>
  <text x="240" y="546" class="t-s">2026-08-19 17:32</text>
  <text x="420" y="546" class="t-s">XGBoost</text>
  <text x="556" y="546" class="t-s">20.597</text>
  <text x="650" y="546" class="t-s" fill="#2E7D52">promoted - first champion</text>

  <text x="168" y="572" class="t-s">2</text>
  <text x="240" y="572" class="t-s">2026-08-28 14:28</text>
  <text x="420" y="572" class="t-s">XGBoost</text>
  <text x="556" y="572" class="t-s">19.687</text>
  <text x="650" y="572" class="t-s" fill="#2E7D52">promoted - current champion</text>

  <text x="168" y="598" class="t-s">3</text>
  <text x="240" y="598" class="t-s">2026-08-28 15:28</text>
  <text x="420" y="598" class="t-s">XGBoost</text>
  <text x="556" y="598" class="t-s">19.687</text>
  <text x="650" y="598" class="t-s" fill="#8d3444">rejected - tie, no improvement</text>

  <rect x="60" y="640" width="880" height="76" rx="12" fill="#E6F2EC" stroke="#2E7D52" stroke-width="1.6"/>
  <text x="80" y="666" class="t-b">Why the gate exists</text>
  <text x="80" y="688" class="t-s">A pipeline that retrains every night will otherwise ship whatever it produced last night. The gate makes a newer model prove itself before it can serve</text>
  <text x="80" y="706" class="t-s">traffic, and the leaderboard leaves an auditable record of every model that was ever considered, promoted or refused.</text>
</svg>
</div></body></html>
