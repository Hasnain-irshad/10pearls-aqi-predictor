<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"></head>
<body><div id="canvas">
<svg width="1080" height="660" viewBox="0 0 1080 660">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2C6FB5"/></marker>
  </defs>
  <text x="540" y="32" text-anchor="middle" class="t-title">Data Design: One Feature Group, Two Backends, Four Published Documents</text>

  <!-- feature group -->
  <rect x="30" y="62" width="470" height="298" rx="12" fill="#E6F2EC" stroke="#2E7D52" stroke-width="2"/>
  <rect x="30" y="62" width="470" height="32" rx="12" fill="#256f6f"/>
  <rect x="30" y="78" width="470" height="16" fill="#256f6f"/>
  <text x="265" y="84" text-anchor="middle" class="t-h" style="fill:#fff">Feature group &#160;aqi_features&#160; version 2</text>

  <text x="50" y="120" class="t-b">Primary key</text>
  <text x="200" y="120" class="t-s">(city, timestamp) - epoch seconds</text>
  <text x="50" y="144" class="t-b">Event time</text>
  <text x="200" y="144" class="t-s">datetime, local to Asia/Karachi</text>
  <text x="50" y="168" class="t-b">Table format</text>
  <text x="200" y="168" class="t-s">HUDI, materialised server-side</text>
  <text x="50" y="192" class="t-b">Write semantics</text>
  <text x="200" y="192" class="t-s">upsert, so a re-run never duplicates</text>
  <text x="50" y="216" class="t-b">Statistics</text>
  <text x="200" y="216" class="t-s">disabled - the profiler exhausted the free-tier executor</text>
  <text x="50" y="240" class="t-b">Online serving</text>
  <text x="200" y="240" class="t-s">off - every consumer is a batch job</text>

  <line x1="50" y1="258" x2="480" y2="258" stroke="#2E7D52" stroke-dasharray="3 3"/>
  <text x="50" y="282" class="t-b">Shape</text>
  <text x="200" y="282" class="t-s">74 columns &#215; roughly 697,000 rows</text>
  <text x="200" y="302" class="t-s">22 cities &#215; hourly &#215; 2023-01-01 to the present</text>
  <text x="200" y="322" class="t-s">about 31,800 rows per city</text>
  <text x="50" y="346" class="t-b">Read path</text>
  <text x="200" y="346" class="t-s">feature view &#160;aqi_feature_view&#160; version 2</text>

  <!-- backends -->
  <rect x="546" y="62" width="504" height="140" rx="12" fill="#EEF4FA" stroke="#2C6FB5" stroke-width="2"/>
  <text x="798" y="90" text-anchor="middle" class="t-h">One facade, two interchangeable backends</text>
  <rect x="570" y="106" width="220" height="76" rx="8" fill="#fff" stroke="#B9C6D6"/>
  <text x="680" y="130" text-anchor="middle" class="t-b">Hopsworks</text>
  <text x="680" y="152" text-anchor="middle" class="t-s">chosen whenever an API key</text>
  <text x="680" y="170" text-anchor="middle" class="t-s">is present: continuous integration</text>

  <rect x="806" y="106" width="220" height="76" rx="8" fill="#fff" stroke="#B9C6D6"/>
  <text x="916" y="130" text-anchor="middle" class="t-b">Local Parquet</text>
  <text x="916" y="152" text-anchor="middle" class="t-s">the fallback on a developer</text>
  <text x="916" y="170" text-anchor="middle" class="t-s">machine, identical schema</text>

  <!-- published docs -->
  <rect x="546" y="226" width="504" height="134" rx="12" fill="#FBEEDF" stroke="#C8881A" stroke-width="2"/>
  <text x="798" y="254" text-anchor="middle" class="t-h" fill="#8a5e12">Published documents, committed each night</text>
  <rect x="566" y="270" width="222" height="34" rx="7" fill="#fff" stroke="#C8881A"/><text x="677" y="292" text-anchor="middle" class="t-s">predictions.json - forecasts</text>
  <rect x="806" y="270" width="222" height="34" rx="7" fill="#fff" stroke="#C8881A"/><text x="917" y="292" text-anchor="middle" class="t-s">evaluation.json - accuracy</text>
  <rect x="566" y="312" width="222" height="34" rx="7" fill="#fff" stroke="#C8881A"/><text x="677" y="334" text-anchor="middle" class="t-s">monitoring.json - drift, error</text>
  <rect x="806" y="312" width="222" height="34" rx="7" fill="#fff" stroke="#C8881A"/><text x="917" y="334" text-anchor="middle" class="t-s">leaderboard.json - history</text>

  <path d="M504,150 L540,132" stroke="#2C6FB5" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M504,290 L540,290" stroke="#2C6FB5" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- forecast payload -->
  <rect x="30" y="392" width="1020" height="240" rx="12" fill="#F7FAFD" stroke="#1F3A5F" stroke-width="1.8"/>
  <text x="540" y="420" text-anchor="middle" class="t-h">Shape of the forecast document served to the dashboard</text>

  <text x="60" y="452" class="t-mono">generated_at</text>
  <text x="300" y="452" class="t-s">timestamp of the run that produced this document</text>
  <text x="60" y="476" class="t-mono">cities[name]</text>
  <text x="300" y="476" class="t-s">one entry per city, keyed by name</text>
  <text x="90" y="500" class="t-mono">.province, .lat, .lon</text>
  <text x="300" y="500" class="t-s">where to place the marker on the map</text>
  <text x="90" y="524" class="t-mono">.current</text>
  <text x="300" y="524" class="t-s">the latest observed AQI and its health category</text>
  <text x="90" y="548" class="t-mono">.hourly[72]</text>
  <text x="300" y="548" class="t-s">datetime, predicted AQI, lower and upper interval bounds, category</text>
  <text x="90" y="572" class="t-mono">.daily[3]</text>
  <text x="300" y="572" class="t-s">the same values averaged into three calendar days</text>
  <text x="90" y="596" class="t-mono">.alert</text>
  <text x="300" y="596" class="t-s">severity, peak value and hour, first crossing of the unhealthy threshold, advice</text>
  <text x="90" y="620" class="t-mono">.explanation</text>
  <text x="300" y="620" class="t-s">SHAP contributions for the peak hour, and the sentence generated from them</text>
</svg>
</div></body></html>
