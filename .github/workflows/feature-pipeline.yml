name: Feature Pipeline (hourly)

# The serverless heartbeat: every hour, fetch the latest data for all cities,
# engineer features, and upsert them into the Hopsworks Feature Store.

on:
  schedule:
    - cron: "5 * * * *" # every hour at :05
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: hopsworks-write # shared with the backfill so they never write concurrently
  cancel-in-progress: false

permissions:
  contents: write # publish the forecast snapshot consumed by the dashboard

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt
      - name: Run feature pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m aqi.pipelines.feature_pipeline --past-days 7

      - name: Batch inference (refresh forecasts)
        if: always()
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m aqi.pipelines.inference

      - name: Commit refreshed forecast
        if: always()
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add -f data/processed/predictions.json
          git commit -m "chore: refresh hourly forecasts [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
