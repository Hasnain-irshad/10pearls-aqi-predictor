name: Training Pipeline (daily)

# Every day: retrain the global model on the latest features, run batch inference
# to refresh the 3-day forecasts for all cities, and commit the predictions JSON
# so the deployed dashboard reads fresh numbers.

on:
  schedule:
    - cron: "30 2 * * *" # daily at 02:30 UTC
  workflow_dispatch: {}

concurrency:
  group: training-pipeline
  cancel-in-progress: false

permissions:
  contents: write # to commit refreshed predictions.json

jobs:
  train-and-infer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements.txt

      - name: Train model
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m aqi.pipelines.training_pipeline

      # Runs even if training failed: inference needs only Open-Meteo and the
      # champion already in the model registry, not the feature store. A flaky
      # feature-store read must not cost the site its daily forecast refresh.
      - name: Batch inference (refresh forecasts)
        if: always()
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: python -m aqi.pipelines.inference

      - name: Evaluation + drift monitoring
        if: always()
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          python -m aqi.models.evaluate || echo "eval skipped"
          python -m aqi.monitoring || echo "monitoring skipped"

      - name: Commit refreshed artifacts
        if: always()
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add -f data/processed/predictions.json data/processed/evaluation.json \
                     data/processed/monitoring.json models_local/leaderboard.json \
                     docs/model_metrics.md docs/model_leaderboard.md docs/evaluation.md \
                     docs/monitoring.md docs/images/*.png
          git commit -m "chore: refresh forecasts + eval + monitoring [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
